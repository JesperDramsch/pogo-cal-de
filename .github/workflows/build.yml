name: Build calendar

on:
  schedule:
  - cron: "17 1,3,5 * * *" # upstream regenerates daily; every 6 h is generous
  workflow_dispatch:
  push:
    paths:
    - "translate.py"
    - "phrases_de.json"
    - "blocklist.txt"
    - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install icalendar

    - name: Generate German calendar
      run: python translate.py

    - name: Commit if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/gocal-de.ics
        if git diff --cached --quiet; then
          echo "No changes."
        else
          git commit -m "Update calendar ($(date -u +%F))"
          git push
        fi
